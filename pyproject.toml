[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-hypervisor-adapter"
version = "0.1.0"
description = "Unified compute adapter for Proxmox (KVM) and VMware vCenter APIs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Devesh B"}
]
keywords = ["hypervisor", "proxmox", "kvm", "vmware", "vsphere", "vcenter", "iaas", "cloud"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "httpx>=0.24.0",
]
sim = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
kvm = [
    "libvirt-python>=9.0.0",
]

[project.scripts]
hva = "hypervisor_adapter.cli:main"
hva-sim = "hypervisor_adapter.simulator:main"
hva-dashboard = "hypervisor_adapter.dashboard:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
